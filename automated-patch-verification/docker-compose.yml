services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: patchverify
      POSTGRES_USER: patchverify
      POSTGRES_PASSWORD: patchverify
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patchverify -d patchverify"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
